name: Weekly digest

on:
  schedule:
    # Monday 01:17 UTC = Monday 09:17 SGT. Off the top of the hour on
    # purpose — GitHub's own docs warn that round times (especially
    # 0 minutes past the hour) see the heaviest scheduler load and are
    # the most likely to be delayed or dropped entirely.
    - cron: "17 1 * * 1"
    # Tuesday safety net, same offset one day later. The `gate` job below
    # only lets this one actually do anything if the page is still stale,
    # i.e. Monday's cron never fired or its run failed validation.
    - cron: "17 1 * * 2"
  workflow_dispatch:
    inputs:
      skip_refresh:
        description: "Republish the current page without regenerating it"
        type: boolean
        default: false

concurrency:
  group: digest
  cancel-in-progress: false

jobs:
  gate:
    # Cheap, always-runs check that decides whether the rest of the workflow
    # should do anything. For every trigger except the Tuesday safety-net
    # cron, it always says yes. For the Tuesday cron specifically, it only
    # says yes if the page is still showing a stale date — i.e. Monday's
    # cron didn't fire, or fired and failed — so a healthy week stays fully
    # silent instead of redeploying and re-notifying for nothing.
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - uses: actions/checkout@v7
      - id: check
        run: |
          if [ "${{ github.event.schedule }}" != "17 1 * * 2" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          UPDATED=$(grep -o 'data-updated="[^"]*"' site/index.html | head -1 | cut -d'"' -f2)
          TODAY=$(TZ=Asia/Singapore date +%Y-%m-%d)
          YESTERDAY=$(TZ=Asia/Singapore date -d yesterday +%Y-%m-%d)
          if [ "$UPDATED" = "$TODAY" ] || [ "$UPDATED" = "$YESTERDAY" ]; then
            echo "Page already fresh (data-updated=$UPDATED) — Monday's scheduled run succeeded. Safety-net run has nothing to do." >> "$GITHUB_STEP_SUMMARY"
            echo "proceed=false" >> "$GITHUB_OUTPUT"
          else
            echo "Page is stale (data-updated=$UPDATED) — Monday's scheduled run appears to have not fired or not succeeded. Running the safety-net refresh." >> "$GITHUB_STEP_SUMMARY"
            echo "proceed=true" >> "$GITHUB_OUTPUT"
          fi

  refresh:
    needs: gate
    # Skipped when dispatched with skip_refresh, which republishes the committed
    # page as-is, or when the gate decided there's nothing to do.
    if: ${{ !inputs.skip_refresh && needs.gate.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - name: Check the Copilot token is configured
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          if [ -z "$COPILOT_GITHUB_TOKEN" ]; then
            echo "::error::Secret COPILOT_GITHUB_TOKEN is not set. Create a PAT with the" \
                 "'Copilot Requests' permission and add it with:" \
                 "gh secret set COPILOT_GITHUB_TOKEN -R \$GITHUB_REPOSITORY"
            exit 1
          fi

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install Copilot CLI
        run: npm install -g @github/copilot

      - name: Rebuild the digest
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          set -o pipefail
          copilot -p "$(cat PROMPT.md)" \
            --model=claude-opus-5 \
            --allow-all-tools \
            --no-ask-user \
            2>&1 | tee /tmp/copilot.log

      - name: Validate before publishing
        run: node tools/validate.mjs site/index.html

      - name: Commit if the page changed
        run: |
          if git diff --quiet -- site/index.html; then
            echo "No change to site/index.html this week." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Use the page's own data-updated stamp (SGT), not the runner's UTC
          # date, so the archive folder always matches what the page says.
          DATE=$(node -e 'console.log(require("fs").readFileSync("site/index.html","utf8").match(/data-updated="([^"]+)"/)[1])')
          mkdir -p "site/$DATE"
          cp site/index.html "site/$DATE/index.html"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/index.html "site/$DATE"
          git commit -m "Refresh the events digest for $DATE"
          git push

      - name: Report what the agent did
        if: always()
        run: |
          {
            echo "### Copilot output (tail)"
            echo '```'
            tail -n 40 /tmp/copilot.log 2>/dev/null || echo "(no log)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: [gate, refresh]
    # Publish when the refresh succeeded, or when it was deliberately skipped
    # (skip_refresh dispatch) — but not when the gate skipped everything
    # because there was nothing to do. A failed generation must not reach
    # Pages either — the previous page stays live.
    if: ${{ always() && needs.gate.outputs.proceed == 'true' && (needs.refresh.result == 'success' || needs.refresh.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      # Check out the commit the refresh job just pushed, not the stale ref.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deploy
        uses: actions/deploy-pages@v5

  notify-teams:
    needs: [gate, deploy]
    # Adding this condition at all drops the implicit "needs must have
    # succeeded" default, so success() is spelled out explicitly here —
    # otherwise this could fire even if deploy failed.
    if: ${{ success() && needs.gate.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # Check out the commit deploy just published, not the stale ref.
      - uses: actions/checkout@v7
        with:
          ref: main
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Post weekly summary to Teams
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TEAMS_WEBHOOK_SECRET: ${{ secrets.TEAMS_WEBHOOK_SECRET }}
        run: |
          set -o pipefail
          node tools/teams-summary.mjs site/index.html \
            | curl -sf -H "Content-Type: application/json" -d @- "$TEAMS_WEBHOOK_URL"
